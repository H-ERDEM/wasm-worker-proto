[package]
name = "vc_tasks"
version = "0.1.0"
edition = "2021"
description = "Deterministic integer-only WASM tasks for the browser volunteer computing prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# wasm-opt (binaryen) is downloaded from GitHub at build time; disabled so the
# build also works behind restrictive networks. Remove this to shrink the .wasm.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
